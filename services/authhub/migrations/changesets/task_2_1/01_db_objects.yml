databaseChangeLog:
- preConditions:
    - runningAs:
        username:  eventflow

- changeSet:
      id:  01-table-users
      author:  author
      changes:
       - createTable:
            tableName:  users
            columns:
              - column:
                  name:  id
                  type:  UUID
                  constraints:
                    primaryKey:  true
                    nullable:  false

              - column:
                  name:  email
                  type:  varchar
                  constraints:
                    unique: true
                    nullable:  false

              - column:
                  name:  password_hash
                  type:  varchar
                  constraints:
                    nullable: false

              - column:
                  name:  created_at
                  type:  timestamptz
                  constraints:
                    nullable: false

              - column:
                  name:  updated_at
                  type:  timestamptz
                  constraints:
                    nullable: false